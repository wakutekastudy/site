<!DOCTYPE html>
<!--
  ============================================================
  わくてかスタディ研究所 定番ゲーム: ゲームページのひな型
  ============================================================
  このファイルは、ゲームページを新しく作るときにコピーして使う「ひな型」です。
  サイトからはリンクしていません(_dev/ フォルダは公開ページに含めない)。
  使い方とルールは同じフォルダの game-page-guide.md を参照してください。

  - <style> の「共通ここから」〜「共通ここまで」は、全ゲームで一字一句同じにします(変えてよいのは --gh-width の値だけ)。
  - HTML の「共通ここから」〜「共通ここまで」は、並び・見た目・文言を全ゲームでそろえます(id 名は変えてよい)。
  - ゲームごとに書き換えるのは、目印に「★ゲームごと」と書いた箇所です。
  - 「サンプル」と書いた部分は、動作確認用の仮のゲーム(ボタンを5回押すと終わる)です。
    実際のゲームに置き換えてください。
  - リンクや画像のパスは、classic-games/ に置いたときの位置で書いています。

  ---- 以下はコピーしたあとに書き換える、各ゲームの先頭コメントの見本 ----
  ゲーム名      : 〇〇 / <slug>
  版            : 0.1
  最終更新日    : YYYY-MM-DD
  ライセンス    : MIT-0(リポジトリの LICENSE を参照)
  題材の確認    : ①ルール(メカニクス) ②名称 ③見た目の表現 の3点で、他社の権利に触れないことを確認した結果
  採用ルール    : ハウスルールの選択(例:パスは3回まで)
  流用できる部品: 例:シャッフル、合法手の判定、CPUの思考
  転用メモ      : 1. 仕組みの核 2. 学習への転用アイディア(実装しない) 3. 差し替える箇所
  ============================================================
-->
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; form-action 'none'; base-uri 'none'">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light dark">
<!-- ★ゲームごと:タイトルと説明文(説明文は「〇〇をブラウザで遊べます。」＋一覧ページのカードの説明) -->
<title>ゲーム名 | 定番ゲーム | わくてかスタディ研究所</title>
<meta name="description" content="ゲーム名をブラウザで遊べます。（一覧ページのカードと同じ説明）">
<meta name="theme-color" content="#FFF8EE" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#24170F" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/png" sizes="32x32" href="../assets/favicon-32.png">
<link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">
<style>
  /* ===== 共通ここから:戻りリンク・見出し・タイトル・ボタン(全ゲームで同じ内容。変えてよいのは --gh-width の値だけ。正本は _dev/game-template.html) ===== */
  :root {
    --gh-width: 32rem;           /* ★ゲームごと:ゲーム本体の幅(盤ゲーム 32rem、カードゲーム 60rem など)。戻りリンクと見出しをこの幅にそろえる */
    --gh-btn-bg: #FFFFFF; --gh-btn-fg: #3B2416; --gh-btn-line: #E3CBB0;
    --gh-cta: #B85215; --gh-cta-fg: #FFFFFF;   /* 白文字 4.93:1 */
  }
  @media (prefers-color-scheme: dark) {
    :root { --gh-btn-bg: #33231A; --gh-btn-fg: #FFF1E0; --gh-btn-line: #6E5443; --gh-cta: #F29A55; --gh-cta-fg: #24170F; }
  }
  [hidden] { display: none !important; }
  .gh-col { box-sizing: border-box; width: calc(100% - 1.5rem); max-width: calc(var(--gh-width) - 1.5rem); margin-left: auto; margin-right: auto; }
  .site-back { display: block; font-size: 0.85rem; line-height: 1.5; padding: 0.6rem 0.75rem 0.25rem; margin-top: 0; margin-bottom: 0.5rem; border-bottom: 1px solid color-mix(in srgb, currentColor 20%, transparent); }
  .site-back.gh-col { padding-left: 0; padding-right: 0; }
  .site-back a { color: inherit; text-underline-offset: 0.2em; }
  .site-back a:focus-visible { outline: 3px solid currentColor; outline-offset: 2px; }
  .game-head { display: flex; align-items: center; justify-content: space-between; gap: 0.5rem; flex-wrap: wrap; padding: 0; margin-top: 0; margin-bottom: 0.5rem; background: none; }
  .game-head h1 { font-family: "Hiragino Mincho ProN", "Yu Mincho", YuMincho, "Noto Serif JP", serif; font-size: 1.4rem; font-weight: 700; line-height: 1.4; margin: 0; flex: 1 1 auto; }
  .game-actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }
  button.gbtn { font: inherit; font-size: 1rem; line-height: 1.2; font-weight: 400; min-height: 2.75rem; padding: 0.5rem 1rem; border-radius: 0.5rem;
    border: 1px solid var(--gh-btn-line); background: var(--gh-btn-bg); color: var(--gh-btn-fg); cursor: pointer; }
  button.gbtn.gbtn-primary { background: var(--gh-cta); color: var(--gh-cta-fg); border-color: var(--gh-cta); font-weight: 700; }
  @media (max-width: 480px) {
    .game-head, .game-actions { gap: 0.4rem; }
    .game-actions button.gbtn { padding: 0.5rem 0.65rem; }   /* 幅375pxでタイトルとボタンを1行に収める */
  }
  /* ===== 共通ここまで ===== */

  /* ===== 標準の部品(新しく作るゲームはこの形を使う。ゲームに合わせて調整してよい) ===== */
  :root {
    /* 配色(ライト)。文字色は背景とのコントラスト比 4.5:1 以上 */
    --ink: #3B2416;              /* 文字・見出し・フォーカスリング */
    --ink-soft: #6E5443;         /* 薄い文字 */
    --paper: #FFF8EE;            /* 背景 */
    --paper-warm: #FFEBD2;       /* パネル・帯 */
    --card: #FFFFFF;             /* カード・入力欄 */
    --line: #E3CBB0;             /* 枠線 */
    --spark: #E8792B;            /* 手番・選択中の枠や印(文字色には使わない) */
    --red-text: #B8321F;         /* 赤スートなど赤系の文字(白 5.98:1) */
    --focus: var(--ink);
  }
  @media (prefers-color-scheme: dark) {
    :root { --ink: #FFF1E0; --ink-soft: #D9C3AE; --paper: #24170F; --paper-warm: #33231A;
      --card: #3A281C; --line: #6E5443; --red-text: #FF9C8C; --focus: #F29A55; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); line-height: 1.6;
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Yu Gothic UI", "Yu Gothic", Meiryo, sans-serif; }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }
  button.gbtn:disabled { opacity: 0.5; cursor: default; }
  /* ルール欄(見出しのすぐ下に開く。最初は閉じる) */
  .rules-panel { background: var(--paper-warm); border-radius: 0.5rem; padding: 0.75rem 1rem; margin-bottom: 0.75rem; }
  .rules-panel h2 { font-size: 1.05rem; margin: 0.75rem 0 0.25rem; }
  .rules-panel h2:first-child { margin-top: 0; }
  .rules-panel ul { padding-left: 1.2em; margin: 0.25rem 0; }
  .rules-panel p { margin: 0.25rem 0; }
  .seed-form { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; margin-top: 0.5rem; }
  .seed-form input { font: inherit; padding: 0.4rem 0.5rem; width: 10em; max-width: 100%; border: 1px solid var(--line); border-radius: 0.4rem; background: var(--card); color: var(--ink); }
  /* 状況の表示と、対局後の「新しいゲーム」 */
  .message { min-height: 1.6em; margin: 0 0 0.75rem; }
  .game-over { display: flex; margin: 0.75rem 0; }
  main { padding-bottom: 1.5rem; }

  /* ===== ゲーム固有のスタイル(★ゲームごと。以下はサンプル) ===== */
  .sample-board { background: var(--card); border: 1px solid var(--line); border-radius: 0.5rem; padding: 1rem; text-align: center; }
  .sample-count { font-size: 2rem; font-weight: 700; margin: 0 0 0.5rem; }
</style>
</head>
<body>
<!-- ===== 共通ここから(HTML):戻りリンク・見出し・ルール欄・メッセージ ===== -->
<nav class="site-back gh-col" aria-label="サイト内"><a href="./">← 定番ゲーム一覧</a> ／ <a href="../">ホーム</a></nav>
<header class="game-head gh-col">
  <h1 id="title"></h1>
  <div class="game-actions">
    <button type="button" id="btn-rules" class="gbtn" aria-expanded="false" aria-controls="rules"></button>
    <button type="button" id="btn-new" class="gbtn gbtn-primary"></button>
  </div>
</header>
<main class="gh-col">
  <section id="rules" class="rules-panel" hidden aria-labelledby="rules-title">
    <h2 id="rules-title"></h2>
    <ul id="rules-list"></ul>
    <h2 id="keys-title"></h2>
    <ul id="keys-list"></ul>
    <h2 id="seed-title"></h2>
    <p id="seed-current"></p>
    <p id="seed-desc"></p>
    <div class="seed-form">
      <label for="seed-input" id="seed-label"></label>
      <input id="seed-input" type="text" inputmode="numeric" autocomplete="off">
      <button type="button" id="btn-seed" class="gbtn"></button>
    </div>
  </section>
  <p id="message" class="message" role="status" aria-live="polite"></p>
<!-- ===== 共通ここまで(HTML) ===== -->

  <!-- ===== ゲーム本体(★ゲームごと。以下はサンプル) ===== -->
  <section id="game" class="sample-board" aria-label="ゲーム">
    <p class="sample-count" id="sample-count"></p>
    <button type="button" id="btn-step" class="gbtn"></button>
  </section>

  <!-- 共通:対局後の「新しいゲーム」(スマホで上に戻らずに始められるように) -->
  <div class="game-over" id="game-over" hidden>
    <button type="button" id="btn-new-2" class="gbtn gbtn-primary"></button>
  </div>
</main>

<script>
'use strict';

/* ============================================================
 * CONFIG:ゲームごとの設定値(★ゲームごと)
 * ============================================================ */
const CONFIG = Object.freeze({
  gameId: 'template',                 // ★ゲームごと:ファイル名(スラッグ)と同じにする
  schemaVersion: 1,                   // 保存形式を変えたら上げる(古い保存データは破棄して新しく始める)
  storageKey: 'wktks.game.template',  // 'wktks.game.' + gameId(接頭辞 wktks. は全ゲーム共通)
  seedMax: 0xFFFFFFFF,                // シードは0以上の32bit整数
  sampleSteps: 5,                     // サンプル:何回押すと終わるか
});

/* ============================================================
 * TEXT:画面の文言はここにまとめる(コード中に直書きしない)
 * 共通の文言は変えない。★の付いたものをゲームごとに書く
 * ============================================================ */
const TEXT = Object.freeze({
  title: 'ゲーム名',                                  // ★ゲームごと
  rulesButton: 'ルール (R)',
  newGame: '新しいゲーム (N)',
  rulesTitle: 'ルール',
  rules: [                                            // ★ゲームごと
    'サンプルです。「1手進める」を5回押すと終わります。',
  ],
  keysTitle: 'キーボード操作',
  keys: [                                             // ★ゲームごと(N/R/Esc の3行は共通)
    'Enter / Space: ボタンを押す',
    'N: 新しいゲーム',
    'R: ルールの表示/非表示',
    'Esc: ルールを閉じる',
  ],
  seedTitle: 'シード',
  seedCurrent: (seed) => `現在のシード: ${seed}`,
  seedDesc: '同じシードで同じ操作をすると、同じ展開になります。',
  seedLabel: 'シード（整数）',
  seedButton: 'このシードで新しいゲーム',
  seedInvalid: 'シードには0以上の整数を入れてください。',
  newGameStarted: (seed) => `新しいゲームを始めました（シード ${seed}）。`,
  restored: '中断したゲームを再開しました。',
  corrupted: '保存データを読み込めなかったため、新しいゲームを始めました。',
  // サンプル用
  step: '1手進める（サンプル）',
  count: (n, max) => `${n} / ${max}`,
  finished: 'ゲーム終了。',
});

/* ============================================================
 * rng:シード付き疑似乱数(ゲームロジックでは、シードを指定できない標準の乱数関数を使わない)
 * DOM に依存させない
 * ============================================================ */
const rng = (() => {
  // mulberry32:シードから決まった順の乱数を作る
  function make(seed) {
    let a = seed >>> 0;
    return function next() {
      a = (a + 0x6D2B79F5) >>> 0;
      let t = a;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }
  function shuffle(array, next) {
    const a = array.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(next() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }
  return Object.freeze({ make, shuffle });
})();

/* ============================================================
 * rules:初期状態・操作の適用・終了判定・保存データの検証
 * 状態は JSON にそのまま変換できる素のデータ。受け取った状態は書き換えず、新しい状態を返す
 * DOM に依存させない(★ゲームごと。以下はサンプル)
 * ============================================================ */
const rules = (() => {
  function newGame(seed) {
    return { schemaVersion: CONFIG.schemaVersion, seed: seed >>> 0, steps: 0, finished: false };
  }
  function apply(state, action) {
    if (state.finished || !action || action.type !== 'step') return state;
    const steps = state.steps + 1;
    return { ...state, steps, finished: steps >= CONFIG.sampleSteps };
  }
  function isOver(state) { return state.finished; }
  // 保存データの検証:形が違うもの・上限を超えるものは受け付けない
  function validate(data) {
    return !!data && typeof data === 'object'
      && data.schemaVersion === CONFIG.schemaVersion
      && Number.isInteger(data.seed) && data.seed >= 0 && data.seed <= CONFIG.seedMax
      && Number.isInteger(data.steps) && data.steps >= 0 && data.steps <= CONFIG.sampleSteps
      && typeof data.finished === 'boolean';
  }
  return Object.freeze({ newGame, apply, isOver, validate });
})();

/* ============================================================
 * storage:localStorage の読み書き。読み込んだら必ず rules.validate を通す
 * ============================================================ */
const storage = (() => {
  function load() {
    let raw;
    try { raw = localStorage.getItem(CONFIG.storageKey); } catch (e) { return { state: null, status: 'unavailable' }; }
    if (raw === null) return { state: null, status: 'none' };
    try {
      const data = JSON.parse(raw);
      if (rules.validate(data)) return { state: data, status: 'ok' };
    } catch (e) { /* 構文エラーは下で破棄 */ }
    try { localStorage.removeItem(CONFIG.storageKey); } catch (e) { /* 何もしない */ }
    return { state: null, status: 'corrupted' };
  }
  function save(state) {
    try { localStorage.setItem(CONFIG.storageKey, JSON.stringify(state)); } catch (e) { /* 保存できなくても遊べる */ }
  }
  return Object.freeze({ load, save });
})();

/* ============================================================
 * ui:描画とイベント処理。状態は直接書き換えず、必ず rules を通す
 * 文字は textContent で入れる(HTML文字列を差し込む書き方は使わない)
 * ============================================================ */
const ui = (() => {
  const $ = (id) => document.getElementById(id);
  let state = null;

  function freshSeed() { return ((Date.now() ^ Math.floor(performance.now() * 1000)) >>> 0); }
  function setMessage(text) { $('message').textContent = text; }
  function fillList(ul, lines) {
    while (ul.firstChild) ul.removeChild(ul.firstChild);
    for (const line of lines) { const li = document.createElement('li'); li.textContent = line; ul.appendChild(li); }
  }

  function fillTexts() {
    document.title = TEXT.title + ' | 定番ゲーム | わくてかスタディ研究所';
    $('title').textContent = TEXT.title;
    $('btn-rules').textContent = TEXT.rulesButton;
    $('btn-new').textContent = TEXT.newGame;
    $('btn-new-2').textContent = TEXT.newGame;
    $('rules-title').textContent = TEXT.rulesTitle;
    fillList($('rules-list'), TEXT.rules);
    $('keys-title').textContent = TEXT.keysTitle;
    fillList($('keys-list'), TEXT.keys);
    $('seed-title').textContent = TEXT.seedTitle;
    $('seed-desc').textContent = TEXT.seedDesc;
    $('seed-label').textContent = TEXT.seedLabel;
    $('btn-seed').textContent = TEXT.seedButton;
    $('btn-step').textContent = TEXT.step;          // サンプル
  }

  function render() {
    $('seed-current').textContent = TEXT.seedCurrent(state.seed);
    $('game-over').hidden = !rules.isOver(state);
    // ---- ここから下はサンプル(★ゲームごと) ----
    $('sample-count').textContent = TEXT.count(state.steps, CONFIG.sampleSteps);
    $('btn-step').disabled = rules.isOver(state);
  }

  function commit(next) {
    state = next;
    storage.save(state);
    render();
  }

  function startNew(seed) {
    toggleRules(false, false);
    commit(rules.newGame(seed));
    setMessage(TEXT.newGameStarted(state.seed));
  }

  // ルール欄の開閉(全ゲーム共通の操作:N=新しいゲーム、R=ルールの開閉、Esc=ルールを閉じる)
  function toggleRules(force, moveFocus = true) {
    const panel = $('rules');
    const open = force === undefined ? panel.hidden : force;
    panel.hidden = !open;
    $('btn-rules').setAttribute('aria-expanded', String(open));
    if (open) $('seed-input').value = '';
    else if (moveFocus && force === false) $('btn-rules').focus();
  }

  function onSeedSubmit() {
    const raw = $('seed-input').value.trim();
    if (!/^\d{1,10}$/.test(raw) || Number(raw) > CONFIG.seedMax) { setMessage(TEXT.seedInvalid); $('seed-input').focus(); return; }
    startNew(Number(raw));
  }

  function onKey(e) {
    if (e.key === 'Escape' && !$('rules').hidden) { e.preventDefault(); toggleRules(false); return; }
    const tag = e.target && e.target.tagName;
    if (tag === 'INPUT' || tag === 'TEXTAREA') return;
    if (e.key === 'n' || e.key === 'N') { e.preventDefault(); startNew(freshSeed()); return; }
    if (e.key === 'r' || e.key === 'R') { e.preventDefault(); toggleRules(); return; }
    // ★ゲームごと:ここにゲームの操作キー(矢印キーなど)を足す
  }

  function init() {
    fillTexts();
    $('btn-new').addEventListener('click', () => startNew(freshSeed()));
    $('btn-new-2').addEventListener('click', () => startNew(freshSeed()));
    $('btn-rules').addEventListener('click', () => toggleRules());
    $('btn-seed').addEventListener('click', onSeedSubmit);
    $('seed-input').addEventListener('keydown', (e) => { if (e.key === 'Enter') { e.preventDefault(); onSeedSubmit(); } });
    document.addEventListener('keydown', onKey);
    $('btn-step').addEventListener('click', () => commit(rules.apply(state, { type: 'step' })));   // サンプル

    const loaded = storage.load();
    if (loaded.state) { commit(loaded.state); setMessage(TEXT.restored); }
    else {
      startNew(freshSeed());
      if (loaded.status === 'corrupted') setMessage(TEXT.corrupted);
    }
  }

  return Object.freeze({ init });
})();

ui.init();
</script>
</body>
</html>
